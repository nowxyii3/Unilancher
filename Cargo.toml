[package]
name = "UniLauncher"
version = "1.1.0-beta.1"
edition = "2021"
authors = ["nowxyii3"]
description = "Lanceur universel de jeux vidéo pour Windows (BETA)"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "links", "accesskit", "clipboard", "system_fonts"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
image = "0.25.10"
discord-rich-presence = "1.1.0"
ureq = { version = "2.10", default-features = false, features = ["tls", "json"] }
sysinfo = "0.33"
winreg = "0.52"
mslnk = "0.1"
sha2 = "0.10"
windows-sys = { version = "0.59", features = ["Win32_System_Power", "Win32_Foundation"] }

[build-dependencies]
winres = "0.1"
