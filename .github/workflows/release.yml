name: Release UniLauncher

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to release (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Production ZIP & Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Tests
        shell: pwsh
        run: |
          $env:CARGO_INCREMENTAL = "0"
          cargo test --verbose

      - name: Build Windows Production Binary
        shell: pwsh
        run: |
          cargo build --release

      - name: Prepare Distribution ZIP
        id: dist
        shell: pwsh
        run: |
          $rawTag = "${{ github.ref_name }}"
          if ([string]::IsNullOrWhiteSpace($rawTag) -or "${{ github.event_name }}" -eq "workflow_dispatch") {
            $rawTag = "${{ github.event.inputs.tag_name }}"
          }
          if (-not $rawTag.StartsWith("v")) {
            $verTag = "v$rawTag"
          } else {
            $verTag = $rawTag
          }

          $archiveName = "UniLauncher-$verTag-Windows.zip"
          $distDir = "UniLauncher-$verTag-Windows"
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null

          Copy-Item -Path "target/release/UniLauncher.exe" -Destination "$distDir\UniLauncher.exe" -Force
          if (Test-Path "LICENSE") {
            Copy-Item -Path "LICENSE" -Destination "$distDir\LICENSE.txt"
          }

          $readme = @"
================================================================================
UniLauncher — Lanceur Universel de Jeux Vidéo pour Windows (x64)
Version : $verTag (Production Stable)
Dépôt GitHub : https://github.com/nowxyii3/Unilancher
================================================================================

🚀 DÉMARRAGE RAPIDE :
1. Décompressez l'intégralité de cette archive ZIP dans un dossier de votre choix.
2. Double-cliquez sur `UniLauncher.exe` pour lancer le lanceur.
3. Application 100% portable et autonome (aucune installation requise).

🎮 FONCTIONNALITÉS :
- Centralisation automatique : Steam, Epic, GOG, EA, Ubisoft, Battle.net, Xbox PC.
- Mode Salon TV / Manette & Clavier (F10).
- Recherche instantanée Spotlight (Alt + Espace).
- Bons plans et jeux gratuits PC hebdomadaires.
- Intégration Discord Rich Presence.
- 8 thèmes sombres immersifs personnalisables.

⚙️ COMPATIBILITÉ :
- Windows 10 / Windows 11 (64-bit).
- Données et jaquettes : %APPDATA%\UniLauncher\
"@
          Set-Content -Path "$distDir\README.txt" -Value $readme -Encoding utf8

          Compress-Archive -Path "$distDir\*" -DestinationPath $archiveName -CompressionLevel Optimal -Force
          Write-Host "Created archive: $archiveName"
          Get-Item $archiveName | Format-List Length, Name

          "tag=$verTag" >> $env:GITHUB_OUTPUT
          "archive_name=$archiveName" >> $env:GITHUB_OUTPUT

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.dist.outputs.tag }}
          name: UniLauncher ${{ steps.dist.outputs.tag }}
          body: |
            ## 🚀 UniLauncher ${{ steps.dist.outputs.tag }} — Release Officielle

            Bienvenue dans la version de production stable d'**UniLauncher** !

            ### 📦 Téléchargement & Utilisation
            - Téléchargez l'archive **`${{ steps.dist.outputs.archive_name }}`** ci-dessous.
            - Décompressez l'archive où vous le souhaitez.
            - Double-cliquez sur `UniLauncher.exe` pour lancer l'application. Aucun installeur requis (100% portable).

            ### ✨ Fonctionnalités Clés
            - 🎮 Centralisation multi-boutiques automatique : Steam, Epic, GOG, EA, Ubisoft, Battle.net, Xbox PC.
            - 📺 Mode Salon TV / Big Picture (F10) pilotable à la manette et au clavier.
            - ⚡ Recherche instantanée Spotlight (Alt + Espace).
            - 🎁 Suivi en direct des jeux gratuits et bons plans PC.
            - 🎧 Discord Rich Presence dynamique.
            - 🎨 Moteur de 8 thèmes sombres (Obsidian, OLED Pur Noir, Cyberpunk, etc.).
          files: ${{ steps.dist.outputs.archive_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
