name: Release UniLauncher

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to release (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Production ZIP and Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Tests
        shell: pwsh
        run: |
          $env:CARGO_INCREMENTAL = "0"
          cargo test --verbose

      - name: Build Windows Production Binary
        shell: pwsh
        run: |
          cargo build --release

      - name: Prepare Distribution ZIP
        id: dist
        shell: pwsh
        run: |
          $rawTag = "${{ github.ref_name }}"
          if ([string]::IsNullOrWhiteSpace($rawTag) -or "${{ github.event_name }}" -eq "workflow_dispatch") {
            $rawTag = "${{ github.event.inputs.tag_name }}"
          }
          if (-not $rawTag.StartsWith("v")) {
            $verTag = "v$rawTag"
          } else {
            $verTag = $rawTag
          }

          $archiveName = "UniLauncher-$verTag-Windows.zip"
          $distDir = "UniLauncher-$verTag-Windows"
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null

          Copy-Item -Path "target\release\UniLauncher.exe" -Destination "$distDir\UniLauncher.exe" -Force
          if (Test-Path "LICENSE") {
            Copy-Item -Path "LICENSE" -Destination "$distDir\LICENSE.txt"
          }
          if (Test-Path "packaging\README_DIST.txt") {
            Copy-Item -Path "packaging\README_DIST.txt" -Destination "$distDir\README.txt"
          }

          Compress-Archive -Path "$distDir\*" -DestinationPath $archiveName -CompressionLevel Optimal -Force
          Write-Host "Created archive: $archiveName"
          Get-Item $archiveName | Format-List Length, Name

          "tag=$verTag" >> $env:GITHUB_OUTPUT
          "archive_name=$archiveName" >> $env:GITHUB_OUTPUT

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.dist.outputs.tag }}
          name: UniLauncher ${{ steps.dist.outputs.tag }}
          body: |
            ## UniLauncher ${{ steps.dist.outputs.tag }} — Release Officielle

            Bienvenue dans la version de production stable d'**UniLauncher** !

            ### Telechargement et Utilisation
            - Telechargez l'archive **${{ steps.dist.outputs.archive_name }}** ci-dessous.
            - Decompressez l'archive ou vous le souhaitez.
            - Double-cliquez sur `UniLauncher.exe` pour lancer le lanceur. Application 100% portable et autonome (aucun installeur requis).

            ### Fonctionnalites Cles
            - Centralisation multi-boutiques automatique (Steam, Epic, GOG, EA, Ubisoft, Battle.net, Xbox PC)
            - Mode Salon TV / Big Picture (F10) pilotable a la manette et au clavier
            - Recherche instantanee Spotlight (Alt + Espace)
            - Suivi en direct des jeux offerts et bons plans PC
            - Discord Rich Presence dynamique
            - Moteur de 8 themes sombres immersifs (Obsidian, OLED, Cyberpunk, etc.)
          files: ${{ steps.dist.outputs.archive_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
